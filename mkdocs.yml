site_name: IHC 2026.2 - Grupo 08
site_description: Documentação do projeto de Interação Humano-Computador
theme:
  name: material
  language: pt-BR
  palette:
    # Esquema de cores claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro (alto contraste)
    # Esquema de cores escuro (alto contraste)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
nav:
  - Início: index.md
  - Planejamento:
    - Equipe: planejamento/equipe.md
  - Atas de Reunião:
    - Reunião 04/09/2026: atas/ata1.md
