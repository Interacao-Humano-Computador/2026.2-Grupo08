site_name: IHC 2026.2 - Grupo 08
site_description: Documentação do projeto de Interação Humano-Computador do Grupo 08, FCTE/UnB, 2026.2.
site_author: Grupo 08 — IHC 2026.2
site_url: https://interacao-humano-computador.github.io/2026.2-Grupo08/

repo_url: https://github.com/Interacao-Humano-Computador/2026.2-Grupo08
repo_name: 2026.2-Grupo08
edit_uri: edit/main/docs/

copyright: Grupo 08 · Interação Humano-Computador · FCTE/UnB · 2026.2

theme:
  name: material
  custom_dir: docs/overrides
  language: pt-BR
  favicon: assets/images_prints/LOGO_DIOLINUX.png
  logo: assets/images_prints/LOGO_DIOLINUX.png
  font:
    text: Inter
    code: IBM Plex Mono
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/contrast
        name: Mudar para modo alto contraste
    - scheme: contrast
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Início: index.md
  - Planejamento do Projeto:
    - Equipe: planejamento/equipe.md
    - Cronograma Planejado: planejamento/cronograma-planejado.md
    - Cronograma Executado: planejamento/cronograma-executado.md
    - Quadro de Atribuições: planejamento/quadro-de-atribuicoes.md
    - Ferramentas: planejamento/ferramentas.md
    - Processo de Design: planejamento/processo-de-design.md
    - Heat Map: planejamento/heatmap.md
    - Lista de Sites Avaliados: planejamento/sites-avaliados.md
    - Site Selecionado: planejamento/site-selecionado.md
  - Análise de Requisitos:
    - Aspectos Éticos e TCLE: analise-requisitos/aspectos-eticos.md
    - Perfil do Usuário: analise-requisitos/perfil-usuario.md
    - Personas e Elenco: analise-requisitos/personas.md
    - Cenários: analise-requisitos/cenarios.md
    - Análise de Tarefas: analise-requisitos/analise-tarefas.md
    - Conteúdo da Disciplina: analise-requisitos/conteudo-disciplina.md
  - Atas de Reunião:
    - Índice de Atas: atas/index.md
    - Reunião 04/09/2026: atas/ata1.md
    - Reunião 07/09/2026 (Grupo +1): atas/ata2.md
    - Reunião 14/09/2026 (Mudança de Escopo): atas/ata3.md
  - Verificação:
    - Auto-Avaliação (Grupo 08): verificacao/grupo08.md
  - Conteúdo Teórico:
    - Itens Avaliados: conteudo-teorico/index.md
  - Elicitação de Requisitos:
    - Perfil do Usuário: requisitos/perfil-de-usuario.md
  - Análise de Requisitos:
    - Características da Plataforma: requisitos/caracteristicas-da-plataforma.md
    - Princípios Gerais de Projeto: requisitos/principios-gerais-de-projeto.md
